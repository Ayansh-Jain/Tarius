# ICE web edge — nginx config baked into the @ice/web image.
#
# Responsibilities:
#   1. Serve the built Vite SPA (static assets in /usr/share/nginx/html) with a
#      history-API fallback so client-side routes like /r/<roomId> resolve to index.html.
#   2. Reverse-proxy the REST API  (/api/*)  to the server container over HTTP.
#   3. Reverse-proxy the Yjs sync  (/sync)    to the server container as a WebSocket,
#      with the Upgrade/Connection dance Hocuspocus requires.
#
# Upstream resolution: the server is the docker-compose service named `server` on the
# shared network. We resolve it LAZILY at request time via Docker's embedded DNS
# (127.0.0.11) rather than with a static `upstream {}` block. That is deliberate:
#   * `nginx -t` and container startup don't fail if `server` isn't up yet, and
#   * nginx picks up `server`'s new IP automatically if the container is recreated.
# Using a variable in `proxy_pass` is what forces nginx to defer the DNS lookup.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen       3000;
  listen       [::]:3000;
  server_name  _;

  root  /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS server; `valid=10s` re-resolves so restarts are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  # Host:port of the @ice/server service. As a variable so resolution is lazy.
  set $ice_server "server:8080";

  # Don't let nginx's default 60s read timeout kill long-lived sync sockets.
  proxy_read_timeout  3600s;
  proxy_send_timeout  3600s;

  # ---- Realtime CRDT sync (WebSocket) -------------------------------------
  location /sync {
    proxy_pass         http://$ice_server$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
  }

  # ---- REST API (HTTP, cookies preserved) ---------------------------------
  # $request_uri keeps the full original path+query (e.g. /api/rooms/abc/invites?x=1)
  # so the server sees exactly what the browser sent — required because nginx does not
  # auto-append the location prefix when proxy_pass uses a variable.
  location /api/ {
    proxy_pass         http://$ice_server$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ---- Static SPA with history fallback -----------------------------------
  # Hashed Vite assets are immutable; cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Lightweight liveness probe for the edge itself.
  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
}
