{{- /*
ICE_SESSION_SECRET (cookie/JWT HMAC) + LiveKit credentials.

Created only when secret.create is true AND secret.existingSecret is empty.
Refuses to template the placeholder so an operator cannot accidentally ship the
well-known "change-me-in-production" value to a real cluster.
*/ -}}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
{{- if or (empty .Values.secret.sessionSecret) (eq .Values.secret.sessionSecret "change-me-in-production") -}}
{{- fail "secret.sessionSecret must be set to a strong value (e.g. `openssl rand -hex 32`). Refusing to deploy the placeholder. Alternatively set secret.create=false and secret.existingSecret to a pre-created Secret." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ice.secretName" . }}
  labels:
    {{- include "ice.labels" . | nindent 4 }}
type: Opaque
stringData:
  ICE_SESSION_SECRET: {{ .Values.secret.sessionSecret | quote }}
  LIVEKIT_URL: {{ .Values.secret.livekit.url | quote }}
  LIVEKIT_API_KEY: {{ .Values.secret.livekit.apiKey | quote }}
  LIVEKIT_API_SECRET: {{ .Values.secret.livekit.apiSecret | quote }}
{{- end -}}
